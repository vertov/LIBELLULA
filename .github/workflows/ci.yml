# LIBELLULA CI: full Icarus Verilog regression on every push and PR.
#
# The benches signal failure by PRINTING (FAIL/TIMEOUT) rather than by exit
# code — vvp exits 0 either way — so each step greps its own log. A step
# fails if make fails (compile error, lint error) OR if any FAIL/TIMEOUT line
# appears. `shell: bash` below is required for the first condition: GitHub's
# default shell runs without pipefail, so `make ... | tee log` would report
# tee's exit status and hide a failing make (v22 lint failures were masked
# this way).
name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash   # bash --noprofile --norc -eo pipefail

jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator
          iverilog -V | head -1
          verilator --version

      - name: Verilator lint
        run: |
          make -C sim -s lint 2>&1 | tee lint.log

      - name: Unit benches
        run: |
          make -C sim -s units 2>&1 | tee units.log
          ! grep -E '(^|[^A-Za-z])(FAIL|TIMEOUT)' units.log

      - name: Claim benches (latency / default-config latency / ±2 px / 1 Meps)
        run: |
          make -C sim -s latency latency-default pxbound meps 2>&1 | tee claims.log
          ! grep -E '(^|[^A-Za-z])(FAIL|TIMEOUT)' claims.log

      - name: Scenario benches
        run: |
          make -C sim -s scenarios 2>&1 | tee scenarios.log
          ! grep -E '(^|[^A-Za-z])(FAIL|TIMEOUT)' scenarios.log

      - name: Hostile benches
        run: |
          make -C sim -s hostile 2>&1 | tee hostile.log
          ! grep -E '(^|[^A-Za-z])(FAIL|TIMEOUT)' hostile.log

      - name: Diagnostic benches (LIBELLULA_DIAG)
        run: |
          make -C sim -s diagnostic 2>&1 | tee diagnostic.log
          ! grep -E '(^|[^A-Za-z])(FAIL|TIMEOUT)' diagnostic.log

      - name: Comparative benchmark harness (runs; results not gated)
        run: |
          python3 benchmarks/run_benchmarks.py 2>&1 | tee bench.log

      - name: STMD reference model smoke test (synthetic, no dataset)
        run: |
          python3 -m pip install --quiet -r stmd/requirements.txt
          python3 stmd/tests/smoke.py
